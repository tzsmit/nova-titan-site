  featured: true
  title: "Nationwide Restaurant Chain Infrastructure Rollout"
  subtitle: "Multi-Site Network Deployment for 7 BREW Expansion"
  client: "Granite Telecommunications (Prime Contractor)"
  end_client: "7 BREW (Multi-Location Rollout)"
  # RELATIONSHIP DISCLOSURE (2026-08 audit): Nova Titan was engaged BY Granite
  # Telecommunications as the field execution subcontractor. 7 BREW was the end
  # client of the prime, NOT a direct Nova Titan customer. This must stay visible
  # on the page so the brand reference is never implied to be a direct account.
  relationship_disclosure: "Nova Titan Systems performed this work as a field execution subcontractor engaged by Granite Telecommunications. 7 BREW was the prime contractor's end client, not a direct Nova Titan Systems customer. Brand names are referenced solely to describe the scope of work performed."
  location: "Lubbock, TX 79424"
  location_city: "Lubbock, TX"
  location_state: "Texas"
  date: "October 2024"
  # ISO-8601 form for schema.org datePublished (human string above is for display)
  date_iso: "2024-10-01"
  project_type: "Multi-Site Enterprise Deployment"
  
  government_type: "Commercial"
  service_type: "Network Infrastructure"
  industry: "Restaurant/Retail"
  region: "Texas"
  
  challenge: "A rapidly expanding drive-thru coffee chain was opening new stores on a fixed construction schedule, and each store needed its network stack live before the point-of-sale and drive-thru systems could be commissioned. Store openings are unforgiving: the equipment delivery, the electrical rough-in and the franchise opening date are all fixed before the low-voltage crew arrives, so any cabling or configuration delay pushes the opening itself. Work had to be sequenced around other trades still finishing the building, and any work at an already-operating location had to avoid business-hour interruption."
  
  solution: "Nova Titan Systems was engaged by Granite Telecommunications as the field execution subcontractor for the low-voltage and network scope. Work included receiving and staging the delivered network equipment, terminating and dressing the network stack, configuring and validating the routers, switches and wireless access points to the prime contractor's provided configuration, verifying circuit hand-off, and confirming each drop before turning the site over. Every site was closed out with the prime's ticketing workflow, including photo documentation and confirmation of live connectivity for the store systems."
  
  services:
    - "Network stack termination, mounting and cable dressing"
    - "Router and switch configuration to prime-supplied specification"
    - "Wireless access point placement, mounting and validation"
    - "Circuit hand-off verification and port-level connectivity testing"
    - "Equipment receiving and on-site staging"
    - "Multi-site scheduling coordinated to store construction and opening dates"
    - "Photo documentation and ticketed closeout per prime contractor workflow"
  
  # RESULTS DISCIPLINE (2026-08 audit): Every line below is an outcome that can
  # be substantiated from the project record / prime contractor ticket. Do NOT
  # add invented percentages, dollar savings, uptime figures or store counts.
  results:
    - "Network infrastructure delivered and validated at each assigned location"
    - "No business-hour interruption at operating locations"
    - "Store systems commissioned on the schedule set by the prime contractor"
    - "Closeout documentation accepted through the prime's ticketing process"
    - "Continued to receive follow-on field assignments from the same prime contractor"
  
  impact: "Store-opening low-voltage work is judged almost entirely on schedule reliability and clean closeout documentation, because the general contractor and the franchisee have already committed to an opening date. This project is representative of how Nova Titan is typically engaged: a prime contractor or enterprise platform owns the customer relationship and the configuration standard, and Nova Titan supplies the local licensed-trade-adjacent field execution, the coordination with other trades on site, and the documented turnover the prime needs to bill the job."
  
  # First-party field lessons — the kind of non-commodity detail that only comes
  # from having actually done the work. Rendered as "Field Notes" on the page.
  field_notes:
    - "On a fixed store-opening date the schedule risk is almost never the cabling itself — it is equipment arriving late or the electrical rough-in not being ready for the low-voltage crew. Confirming material on site and pathway readiness before mobilizing is what protects the opening date."
    - "Multi-site rollouts fail on documentation far more often than on installation. When the prime is billing per site, a site is not finished until the photos and the ticket closeout are accepted, so closeout is scheduled as part of the work, not after it."
    - "Working through a prime contractor's configuration standard means the field crew must validate against a spec it did not author. Port-level verification before turnover prevents a return trip that no one has budgeted."
  
  metrics:
    timeline: "1 week"
    services_count: 7
    locations_covered: "Multiple"
    downtime: "Zero"
  
  technical_specs: "Network stack deployment, enterprise wireless infrastructure, secure routing, Granite Ticket 5959515"
  
  icon: "fas fa-coffee"
  color: "purple"
  
  meta_description: "Nova Titan Systems deployed multi-site network infrastructure for 7 BREW restaurant chain expansion in Lubbock, TX with zero business disruption."
  keywords: "multi-site network deployment, restaurant IT infrastructure, Granite Telecommunications, enterprise wireless, West Texas IT"

