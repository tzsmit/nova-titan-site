    - "Validated connectivity against the prime contractor's requirements"
    - "Completed ticketed closeout under Granite Ticket 5959515"
    - "Completed the assigned work without a reported service interruption"
  
  impact: "This project is representative of how Nova Titan is typically engaged for store-opening low-voltage work: a prime contractor owns the customer relationship and configuration standard, and Nova Titan supplies the on-site field execution and the documented turnover the prime needs to bill the job."
  
  # First-party field lessons — the kind of non-commodity detail that only comes
  # from having actually done the work. Rendered as "Field Notes" on the page.
  field_notes:
    - "On a fixed store-opening date the schedule risk is almost never the cabling itself — it is equipment arriving late or the electrical rough-in not being ready for the low-voltage crew. Confirming material on site and pathway readiness before mobilizing is what protects the opening date."
    - "Working through a prime contractor's configuration standard means the field crew must validate against a spec it did not author. Port-level verification before turnover prevents a return trip that no one has budgeted."
  
