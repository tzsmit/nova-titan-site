  challenge: "7 BREW required network stack installation at a new Lubbock, TX location before the store could open. Nova Titan Systems was engaged by Granite Telecommunications as the field execution subcontractor for the low-voltage and network scope."
  
  solution: "Nova Titan Systems received and staged the delivered network equipment, terminated and dressed the network stack, and configured and validated the routers, switches and wireless access points to the prime contractor's provided configuration. Circuit hand-off was verified and connectivity confirmed before the site was turned over. The engagement was closed out through the prime's ticketing workflow, including photo documentation."
  
