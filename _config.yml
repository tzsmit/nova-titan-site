# ============================================================================
# REDIRECT ARCHITECTURE — SINGLE SOURCE OF TRUTH
# ============================================================================
# This site is Jekyll on GitHub Pages. Redirects are generated ONLY by the
# `jekyll-redirect-from` plugin reading `redirect_from:` front matter on the
# DESTINATION page. There is no Netlify `_redirects` / `netlify.toml` in play.
#
# A `redirects:` block used to live here in Netlify style. It was inert (nothing
# consumed it) and had DRIFTED from reality — e.g. it documented
# `/plans/ -> /contact/` while the actual generated redirect sends /plans/ to
# /quote/, and it listed `/case-studies/ -> /services/` even though
# /case-studies/ is a live, indexable page. It has been removed so no future
# maintainer implements the wrong redirects from stale documentation.
#
# TO ADD A REDIRECT: add the old path to `redirect_from:` on the target page,
# then add a regression assertion in .github/workflows/seo-qa.yml.
# The authoritative human-readable map is REDIRECTS.md (kept in sync by CI).
# ============================================================================

# Build Settings
markdown: kramdown
permalink: pretty

# Theme
theme: minima

# Plugins
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-redirect-from

# Collections
collections:
  posts:
    output: true
    permalink: /blog/:title/

# Default Front Matter
# NOTE (2026-08): the site-wide defaults that used to live here have been MOVED
# into the single consolidated `defaults:` block further down this file (near the
# capability-statement PDF alias rules). Reason: this file previously declared
# `defaults:` twice. YAML forbids duplicate mapping keys and resolves them
# last-wins, so THIS block was silently discarded and never applied. Do not
# re-add a second `defaults:` key here -- add entries to the consolidated block.

# Exclude from build
# NOTE: do NOT use a blanket "*.md" exclude — it also excludes _posts/*.md
# and silently prevents blog posts from building (SEO audit 2026-07).
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - .git
  - .gitignore
  - README.md
  - GBP_PHOTO_UPLOAD_PLAN.md
  - POST_LAUNCH_SEO_ACTIONS.md
  - rejected_photos_notes.md
  - _batch2_review
  # Local-only legacy clone of the pre-migration site. It is .gitignored (so CI
  # never sees it), but if present locally Jekyll would build a full duplicate of
  # the OLD site into /nova-titan-site/* AND inject ~55 duplicate URLs into
  # sitemap.xml. Excluding it keeps local builds identical to CI/production.
  - nova-titan-site
  - vendor
  - .bundle
  # PUBLIC-HYGIENE CLEANUP (2026-08, post-#47). These are repo/CI documentation
  # and developer tooling that Jekyll was publishing verbatim at HTTP 200 on the
  # production domain. Audited before exclusion -- each had: no runtime
  # dependency, zero inbound href/src references in the built HTML, and no
  # sitemap entry. EXCLUDED FROM THE BUILD ONLY -- all files remain in the
  # repository.
  #
  # REDIRECTS.md is a CI DEPENDENCY: .github/workflows/seo-qa.yml opens it by
  # repo-root-relative path ("REDIRECTS.md") from the actions/checkout working
  # directory, NOT from _site. Jekyll `exclude:` only controls what is copied
  # into _site, so the hardened redirect-drift gate still reads it normally.
  # It must NEVER be deleted or moved.
  - REDIRECTS.md
  # ci-proposed/ published a full copy of a CI workflow -- including its
  # banned-phrase list -- on the live site.
  - ci-proposed
  # Developer scripts (crawl_conversion_surfaces.py). Not referenced by any page.
  - tools
  #
  # NOT excluded in this pass, deliberately:
  #   assets/js/download-handler.js -- dead code, but it lives under assets/ and
  #     could plausibly have been linked/cached historically. Left published and
  #     annotated rather than risk a 404 on an asset path.
  #   redirects.json -- NOT a repo file. It is generated by jekyll-redirect-from
  #     (site.config["redirect_from"]["json"] != false), so `exclude:` cannot
  #     remove it; suppressing it needs a plugin config change, which was not
  #     proven regression-free and is out of scope here.

# Include
include:
  - _pages
  - .well-known

# Sitemap settings
sitemap: true

# ---------------------------------------------------------------------------
# HISTORICAL CAPABILITY-STATEMENT PDF ALIASES — keep 200, keep OUT of sitemap.
#
# 2026-08 correction pass. Two capability-statement PDF URLs were already
# indexed by Google:
#   /assets/capability-statement/novatitan-capability-statement.pdf
#   /assets/docs/nova-titan-systems-capability-statement-hubzone-2026.pdf
#
# An earlier attempt replaced them with HTML meta-refresh "tombstones" published
# at those exact .pdf paths. THAT WAS WRONG. GitHub Pages assigns Content-Type
# purely from the file extension (verified live: .txt -> text/plain,
# .xml -> application/xml), so an HTML body at a .pdf path would be served as
# `application/pdf` and would render as a CORRUPT PDF. GitHub Pages also cannot
# issue a 301 or set custom headers, so there is no redirect option for an exact
# static asset path.
#
# Correct fix: serve a REAL, CURRENT, ACCURATE PDF at each historical URL
# (byte-identical to the canonical 2026 statement). The previously-served file at
# the first URL was genuinely obsolete — it claimed "CAGE: Pending Assignment"
# (real CAGE is 170W6) and marketed retired cybersecurity/cloud-security and
# managed-IT lines — so the content IS corrected; only the URL survives.
#
# Because all three files are byte-identical, only the CANONICAL path belongs in
# sitemap.xml. Static binaries cannot carry front matter, so `sitemap: false` is
# applied here via `defaults` (the only mechanism jekyll-sitemap honors for
# non-front-matter files). These URLs stay crawlable and return 200 — they are
# simply not *submitted* as separate documents.
#
# PHASE 2 CORRECTION (2026-08) -- THIRD HISTORICAL ALIAS RESTORED.
#
#   assets/docs/nova-titan-systems-federal-capability-statement.pdf
#
# This URL was published 2025-12-01 (dc83ae4) and hard-DELETED on 2026-03-20
# (b97f95d, "site cleanup ... stale files"). The deletion shipped to production,
# so the URL has been returning HTTP 404 ever since -- verified live during this
# pass (404, text/html, Nova Titan "Page Not Found").
#
# The deleted document was genuinely obsolete. Its recovered bytes
# (md5 f64addf90cb4a4df221744f1609ebb98, 201102 b) contain, by text extraction:
# cybersecurity x9, cloud security x6, CloudWarden IAM x3, Zero Trust x2,
# vulnerability x4, penetration testing, managed services x2, remote support x2,
# OT/ICS, the OLD "1307 59th St" address x2, retired primary NAICS 541511/541512/
# 541519, and "Texas HUB ... in progress" language.
#
# Deleting it was therefore right on CONTENT and wrong on URL HANDLING: it
# converted an indexed federal-procurement asset into a 404 instead of correcting
# it in place. Restoring the path with the CURRENT accurate statement recovers the
# link equity and removes the stale claims at the same time. Same alias strategy,
# same rationale as the two entries below.
# ---------------------------------------------------------------------------
#
# NOTE (2026-08): this `defaults:` block was previously a SECOND top-level
# `defaults:` key in this file, while another `defaults:` block was declared
# earlier (site-wide layout/lang/image). YAML mappings cannot hold duplicate
# keys -- last one wins -- so the earlier block was being SILENTLY DISCARDED at
# parse time. The two are now merged into this single block. Verified: all 33
# front-matter pages already set `layout:` explicitly and none relied on the
# defaulted `image:` (og:image is emitted by _includes/head.html), so the built
# output is unchanged; this removes a latent trap for the next page added
# without an explicit layout.
defaults:
  # --- site-wide (formerly the first, shadowed `defaults:` block) ---
  - scope:
      path: ""
    values:
      layout: "default"
      lang: "en"
      image: /assets/images/nova-titan-og-image.png
  - scope:
      path: "_posts"
      type: "posts"
    values:
      layout: "post"
      lang: "en"
  # --- historical capability-statement PDF aliases: keep 200, keep out of sitemap ---
  - scope:
      path: "assets/capability-statement/novatitan-capability-statement.pdf"
    values:
      sitemap: false
  - scope:
      path: "assets/docs/nova-titan-systems-capability-statement-hubzone-2026.pdf"
    values:
      sitemap: false
  - scope:
      path: "assets/docs/nova-titan-systems-federal-capability-statement.pdf"
    values:
      sitemap: false

