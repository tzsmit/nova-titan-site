name: IndexNow (post-deploy crawl notification)

# --------------------------------------------------------------------------
# PR #59 — AI Search Discovery / IndexNow / Crawl Measurement
#
# WHAT THIS IS: a best-effort notification to Bing's IndexNow protocol that
# some subset of novatitan.net's PUBLIC, INDEXABLE pages changed, so Bing
# (and IndexNow's other participating engines: Yandex, Naver, Seznam.cz,
# Yep) can re-crawl sooner than their normal schedule. Bing's own index is
# also a known upstream input to some AI answer engines (e.g. Copilot),
# which is the sole reason this is in scope for the 2026 AI-search brief.
#
# WHAT THIS IS NOT:
#   - This is NOT Google's indexing API. It has no effect on Google Search,
#     AI Overviews, or AI Mode.
#   - This does NOT directly notify OpenAI/ChatGPT. ChatGPT Search uses its
#     own independent crawler (OAI-SearchBot); see INDEXNOW.md and §8/§9 of
#     the governing brief for why no OAI-SearchBot-specific change was made.
#
# NON-NEGOTIABLE SAFETY REQUIREMENT (brief §6/§24):
# IndexNow failure must NEVER fail the site deployment. This workflow is
# ENTIRELY SEPARATE from both the Pages deployment and from the SEO QA hard
# gate (seo-qa.yml) -- it triggers only AFTER GitHub Pages reports the
# deployment as already complete, and every step that talks to the network
# is `continue-on-error: true` as a second, redundant layer of protection on
# top of tools/submit_indexnow.py's own internal try/except-and-exit-0
# behavior. A red run of THIS workflow can never block a merge, a deploy,
# or any other workflow.
# --------------------------------------------------------------------------

on:
  workflow_run:
    # PR #60 hotfix (2026-08, live-production-proven): `workflow_run.workflows`
    # filters by the triggering workflow's REGISTERED DEFINITION name -- the
    # `name` field returned by the workflow-DEFINITION endpoint
    # (`GET /repos/{owner}/{repo}/actions/workflows`) -- NOT by the display
    # name shown on individual RUN records (`GET .../actions/runs`). For this
    # GitHub-managed Pages workflow, those two endpoints report DIFFERENT
    # values for the exact same workflow (workflow_id 179842344, path
    # dynamic/pages/pages-build-deployment):
    #   workflow-DEFINITION endpoint name (what workflow_run.workflows must
    #     match): "pages-build-deployment"
    #   RUN-RECORD/display name (cosmetic UI label only, NOT a match target):
    #     "pages build and deployment"
    # PR #59 round 2 mistook the run-record display name for the registered
    # workflow name and changed this trigger to "pages build and deployment",
    # which GitHub's workflow_run dispatcher never matches. Live proof: after
    # PR #59 merged (e43a82c58458679bb55c6793790582f395f0427f) and Pages
    # deployment succeeded (run 33325949629), this workflow recorded ZERO
    # workflow_run-triggered runs. Restored here to the correct, registered
    # definition name. See INDEXNOW.md for full evidence.
    workflows: ["pages-build-deployment"]
    types: [completed]
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  submit:
    # Only proceed for a SUCCESSFUL production deploy of main. A failed or
    # in-progress Pages build must not trigger a submission of (possibly
    # stale, possibly not-yet-live) URLs.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      # PR #59 REVIEW FOLLOW-UP (2026-08): checkout the EXACT SHA the
      # triggering deployment built, not the branch tip. `ref: main` here was
      # a race condition -- if another commit landed on `main` between the
      # Pages deploy completing and this job actually starting, the job would
      # build sitemap.xml from a NEWER commit while `github.event.workflow_run
      # .head_sha` (used below to compute the git diff) still pointed at the
      # OLDER, already-deployed commit. That mismatch could select a stale
      # set of "changed" URLs relative to what was actually just deployed.
      # `workflow_dispatch` (manual runs) has no specific deployment to pin
      # to, so it continues to use the current `main` tip by design.
      # `fetch-depth: 2` is kept: checking out a specific SHA with depth 2
      # still fetches that commit plus its parent, which is exactly what the
      # "Determine before/after commits" step below needs to resolve
      # `${AFTER}~1`.
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || 'main' }}
          fetch-depth: 2

      - name: Set up Ruby (to build the same _site IndexNow reads from)
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Build site
        run: bundle exec jekyll build

      - name: Determine before/after commits
        id: shas
        run: |
          AFTER="${{ github.event.workflow_run.head_sha }}"
          if [ -z "$AFTER" ]; then AFTER="$(git rev-parse HEAD)"; fi
          BEFORE="$(git rev-parse "${AFTER}~1" 2>/dev/null || echo '')"
          echo "after=$AFTER" >> "$GITHUB_OUTPUT"
          echo "before=$BEFORE" >> "$GITHUB_OUTPUT"

      - name: Submit changed URLs to IndexNow
        continue-on-error: true
        env:
          INDEXNOW_BEFORE_SHA: ${{ steps.shas.outputs.before }}
          INDEXNOW_AFTER_SHA: ${{ steps.shas.outputs.after }}
        run: python3 tools/submit_indexnow.py

      - name: Result note
        if: always()
        run: |
          echo "IndexNow submission attempted. This workflow's outcome does" \
               "not affect and was not affected by the site deployment."
